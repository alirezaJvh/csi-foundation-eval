# CSI-Bench HP copy of classical_baseline.yaml: 4 windows x 3 feature sets x 2 selection x 3 heads x 8 room sets = 576 runs.
# Stride rule: csi_bench_hp uses stride 6 (one window start about every 50 ms at about 122 Hz, the padova rule); tor_vergata uses stride 1. Stride is not tuned.
# Rooms are the CSI-Bench environments E01-E06 and E27: each room alone, then all seven pooled.
# window_len starts at 20 because paper_beamforming needs at least 18 packets.
# Preprocessing is ant2 for every cell (paper_beamforming requires exactly 2 antennas; the adapter keeps tx0's 2 receive chains).
# mrmr k stays <= 3, the smallest feature-set width (amplitude_stats).
dataset: csi_bench_hp
split: "a17121b9b216"  # time_block, fractions 0.6/0.2/0.2, gap 64
selection: {rooms: [E01]}
preprocessing: [ant2]
window_len: 40
stride: 6
extractors: [{name: amplitude_stats}]
feature_selection: null
head: {name: svm}
seeds: [0]
role: comparison
sweep:
  window_len: [20, 30, 40, 50]
  extractors:
    - [{name: amplitude_stats}]
    - [{name: paper_beamforming}]
    - [{name: amplitude_stats}, {name: paper_beamforming}]
  feature_selection:
    - null
    - {mrmr: {k: [2, 3]}}
  head.name: [svm, knn, random_forest]
  selection.rooms:
    - [E01]
    - [E02]
    - [E03]
    - [E04]
    - [E05]
    - [E06]
    - [E27]
    - [E01, E02, E03, E04, E05, E06, E27]
