# Frozen LWM on CSI-Bench HP, long windows (Story 6.7): the reduced lwm.yaml grid on the cells of
# csi_bench_hp_long_windows.yaml (plan d6b97e4f25b3, time_block, gap 610).
# 3 heads x 2 LWM presets x 4 windows x 8 room sets = 192 runs.
# Grid kept from the median LWM test macro-F1 on tor_vergata (lwm.yaml, 4500 runs,
# sprint-change-proposal-2026-11-10):
#   presets lwm_rescale_phase (time_block 0.990, room_holdout 0.245) and lwm_amplitude
#     (0.989, 0.25): the two best rescale presets under both protocols.
#   embedding cls (0.972 / 0.201) over channel_mean (0.972 / 0.189).
#   pooler mean_std (0.985 / 0.216) over mean (0.965 / 0.182).
#   heads svm (0.985 on time_block), mlp (0.231, best on room_holdout), logreg (0.976, cheapest).
#   windows 122, 244, 366, 610 packets = 1, 2, 3, 5 s at about 122 Hz: the windows of
#     csi_bench_hp_long_windows.yaml. Long windows only: the short-window classical CSI-Bench
#     runs are incomplete.
#   antennas ant2 only: the adapter keeps tx0's 2 receive chains, so ant4 is invalid.
# Stride rule: stride = window/2 (61, 122, 183, 305), as csi_bench_hp_long_windows.yaml.
# Stride is not tuned. At gap 610 the gap is never shorter than the window.
# Rooms are the CSI-Bench environments E01-E06 and E27: each room alone, then all seven pooled.
# The runs appear in the report section `csi_bench_hp / time_block, gap_packets 610`.
# head.name is the outermost axis, so the cheap heads (logreg, mlp) cover every cell first.
# The antenna preset comes first, then the LWM preset.
dataset: csi_bench_hp
split: "d6b97e4f25b3"  # time_block, fractions 0.6/0.2/0.2, gap 610
selection: {rooms: [E01]}
preprocessing: [ant2, lwm_rescale_phase]
window_len: 122
stride: 61
extractors: [{name: lwm, params: {embedding: cls}}]
pooler: mean_std
feature_selection: null
head: {name: logreg}
seeds: [0]
role: comparison
sweep:
  head.name: [logreg, mlp, svm]
  preprocessing.1: [lwm_rescale_phase, lwm_amplitude]
  "@window":
    - {window_len: 122, stride: 61}
    - {window_len: 244, stride: 122}
    - {window_len: 366, stride: 183}
    - {window_len: 610, stride: 305}
  selection.rooms:
    - [E01]
    - [E02]
    - [E03]
    - [E04]
    - [E05]
    - [E06]
    - [E27]
    - [E01, E02, E03, E04, E05, E06, E27]
