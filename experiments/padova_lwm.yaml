# Frozen LWM on Padova, short windows (Story 6.7): the reduced lwm.yaml grid under the protocols
# of padova_classical_baseline.yaml (time_block, gap 64, one room per column) and
# padova_cross_room.yaml (room_holdout, bedroom -> living_room / laboratory).
# 3 heads x 2 antenna sets x 2 LWM presets x 3 windows x 5 protocols = 180 runs
# (108 time_block: bedroom, living_room, laboratory; 72 room_holdout: 2 directions).
# Grid kept from the median LWM test macro-F1 on tor_vergata (lwm.yaml, 4500 runs,
# sprint-change-proposal-2026-11-10):
#   presets lwm_rescale_phase (time_block 0.990, room_holdout 0.245) and lwm_amplitude
#     (0.989, 0.25): the two best rescale presets under both protocols; power+phase (0.991)
#     ties on time_block but not on room_holdout, rescale 0.904 and power 0.885 lag.
#   embedding cls (0.972 / 0.201) over channel_mean (0.972 / 0.189).
#   pooler mean_std (0.985 / 0.216) over mean (0.965 / 0.182).
#   heads svm (0.985 on time_block), mlp (0.231, best on room_holdout), logreg (0.976 / 0.191,
#     cheapest); random_forest and knn are dropped.
#   windows 10, 30, 50: w10 is the best room_holdout window (0.221), w50 the best time_block
#     window (0.980), w30 between; w30 and w50 match padova_classical_baseline /
#     padova_cross_room cells, w10 is LWM-only (classical starts at 20 for paper_beamforming).
#   antennas ant2 and ant4: Padova has 4 receive antennas; LWM takes 1-4.
# Stride rule: padova uses stride 9 (one window start about every 50 ms at 173 Hz), as the
# classical sweeps. Stride is not tuned.
# room_holdout uses short windows only: its plans have gap 64, and the gap must exceed the window.
# head.name is the outermost axis, so the cheap heads (logreg, mlp) cover every cell first; svm
# fills in afterwards. Runs resume. The antenna preset comes first, then the LWM preset.
# `split` and `selection.rooms` are paired in `@protocol`: with room_holdout, selection.rooms must
# equal train_rooms + test_rooms.
dataset: padova
split: "b6010d87ce4d"  # time_block, fractions 0.6/0.2/0.2, gap 64
selection: {rooms: [bedroom]}
preprocessing: [ant2, lwm_rescale_phase]
window_len: 10
stride: 9
extractors: [{name: lwm, params: {embedding: cls}}]
pooler: mean_std
feature_selection: null
head: {name: logreg}
seeds: [0]
role: comparison
sweep:
  head.name: [logreg, mlp, svm]
  preprocessing.0: [ant2, ant4]
  preprocessing.1: [lwm_rescale_phase, lwm_amplitude]
  window_len: [10, 30, 50]
  "@protocol":
    - {split: "b6010d87ce4d", selection.rooms: [bedroom]}  # time_block, bedroom
    - {split: "b6010d87ce4d", selection.rooms: [living_room]}  # time_block, living_room
    - {split: "b6010d87ce4d", selection.rooms: [laboratory]}  # time_block, laboratory
    - {split: "725a12be6b83", selection.rooms: [bedroom, living_room]}  # room_holdout, bedroom→living_room
    - {split: "99d235eb2f0e", selection.rooms: [bedroom, laboratory]}  # room_holdout, bedroom→laboratory
